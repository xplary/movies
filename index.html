<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWeb - Audio en Español</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #141414; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .movie-card { transition: transform 0.3s ease; }
        .movie-card:hover { transform: scale(1.05); cursor: pointer; }
        .loader { 
            border: 4px solid rgba(255, 255, 255, 0.1); 
            border-left-color: #e50914; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            display: none; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #player-modal { backdrop-filter: blur(5px); }
        .server-btn.active { background-color: #e50914; color: white; border-color: #e50914; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="flex items-center justify-between p-5 bg-[#0b0b0b] shadow-lg sticky top-0 z-50">
        <div class="text-2xl font-bold text-red-600"><i class="fas fa-play-circle mr-2"></i>CineWeb Español</div>
        <div class="flex items-center space-x-4">
            <form id="search-form" class="relative">
                <input type="text" id="search-input" placeholder="Buscar película..." class="bg-[#2b2b2b] text-white px-4 py-2 rounded-full outline-none focus:ring-2 focus:ring-red-600 text-sm">
                <button type="submit" class="absolute right-3 top-2.5 text-gray-400 hover:text-white"><i class="fas fa-search"></i></button>
            </form>
            <button onclick="toggleSettings()" class="text-gray-400 hover:text-white text-xl" title="Configuración"><i class="fas fa-cog"></i></button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8">
        <h2 id="section-title" class="text-2xl mb-6 font-semibold border-l-4 border-red-600 pl-3">Películas Populares</h2>
        <div class="loader" id="main-loader"></div>
        <div id="movies-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6"></div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex justify-center items-center z-50">
        <div class="bg-[#1e1e1e] p-8 rounded-lg w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Configuración del Sistema</h3>
            <label class="block text-sm text-gray-400 mb-2">TMDB API Key</label>
            <input type="text" id="tmdb-key-input" class="w-full bg-[#2b2b2b] text-white p-2 rounded mb-4 outline-none border border-gray-700 focus:border-red-600">
            <div class="flex justify-end space-x-3">
                <button onclick="toggleSettings()" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-500 transition">Cancelar</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700 transition">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Reproducción -->
    <div id="player-modal" class="fixed inset-0 bg-black bg-opacity-95 hidden flex-col justify-center items-center z-50">
        
        <div class="absolute top-5 left-5 right-5 flex justify-between items-center z-50">
            <div id="server-selector" class="hidden flex space-x-2 overflow-x-auto pb-2">
                <span class="text-gray-400 text-sm my-auto mr-2 font-semibold">Servidores Alternativos:</span>
                <button onclick="changeServer('superembed')" id="btn-superembed" class="server-btn px-3 py-1 bg-transparent border border-gray-600 text-gray-300 rounded text-sm hover:bg-gray-800 transition">SuperEmbed (Agregador)</button>
                <button onclick="changeServer('autoembed')" id="btn-autoembed" class="server-btn px-3 py-1 bg-transparent border border-gray-600 text-gray-300 rounded text-sm hover:bg-gray-800 transition">AutoEmbed</button>
                <button onclick="changeServer('vidsrcnet')" id="btn-vidsrcnet" class="server-btn px-3 py-1 bg-transparent border border-gray-600 text-gray-300 rounded text-sm hover:bg-gray-800 transition">VidSrc.net</button>
            </div>
            <button onclick="closePlayer()" class="text-white text-3xl hover:text-red-600 transition ml-auto"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="loader" id="player-loader"></div>
        <p id="player-status" class="text-gray-400 mt-4 hidden text-center px-4">Cargando reproductor...</p>
        
        <iframe id="movie-iframe" class="w-full max-w-5xl rounded-lg shadow-2xl hidden bg-black aspect-video mt-12" allowfullscreen></iframe>
    </div>

    <script>
        let tmdbKey = localStorage.getItem('tmdbKey') || 'f6f6b797c560857281e0513011f50403';
        let currentTmdbId = null;

        const moviesGrid = document.getElementById('movies-grid');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const sectionTitle = document.getElementById('section-title');
        const mainLoader = document.getElementById('main-loader');
        const settingsModal = document.getElementById('settings-modal');
        const tmdbKeyInput = document.getElementById('tmdb-key-input');
        
        const playerModal = document.getElementById('player-modal');
        const movieIframe = document.getElementById('movie-iframe');
        const playerLoader = document.getElementById('player-loader');
        const playerStatus = document.getElementById('player-status');
        const serverSelector = document.getElementById('server-selector');

        if (!tmdbKey) { toggleSettings(); } else { fetchPopularMovies(); }

        function toggleSettings() {
            settingsModal.classList.toggle('hidden');
            settingsModal.classList.toggle('flex');
            tmdbKeyInput.value = tmdbKey;
        }

        function saveSettings() {
            const key = tmdbKeyInput.value.trim();
            if (key) {
                tmdbKey = key;
                localStorage.setItem('tmdbKey', tmdbKey);
                toggleSettings();
                fetchPopularMovies();
            }
        }

        async function fetchPopularMovies() {
            if (!tmdbKey) return;
            sectionTitle.innerText = "Películas Populares en Español";
            await fetchMovies(`https://api.themoviedb.org/3/trending/movie/week?api_key=${tmdbKey}&language=es-ES`);
        }

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                sectionTitle.innerText = `Resultados para: "${query}"`;
                await fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(query)}&language=es-ES`);
            } else {
                fetchPopularMovies();
            }
        });

        async function fetchMovies(url) {
            moviesGrid.innerHTML = '';
            mainLoader.style.display = 'block';
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(movie => {
                        if (movie.poster_path) {
                            const card = document.createElement('div');
                            card.className = 'movie-card relative group rounded-lg overflow-hidden bg-[#222]';
                            card.onclick = () => openPlayer(movie.id);
                            card.innerHTML = `
                                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}" class="w-full h-auto object-cover">
                                <div class="absolute inset-0 bg-black bg-opacity-80 opacity-0 group-hover:opacity-100 flex flex-col justify-end p-4 transition-opacity duration-300">
                                    <h4 class="font-bold text-sm mb-1 text-white">${movie.title}</h4>
                                    <div class="text-xs text-yellow-400"><i class="fas fa-star"></i> ${movie.vote_average.toFixed(1)}</div>
                                </div>
                            `;
                            moviesGrid.appendChild(card);
                        }
                    });
                }
            } catch (error) {
                console.error('Error TMDB:', error);
            } finally {
                mainLoader.style.display = 'none';
            }
        }

        function openPlayer(tmdbId) {
            currentTmdbId = tmdbId;
            playerModal.classList.remove('hidden');
            playerModal.classList.add('flex');
            serverSelector.classList.remove('hidden');
            
            // Inicia cargando SuperEmbed
            changeServer('superembed');
        }

        function changeServer(serverName) {
            movieIframe.src = '';
            document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${serverName}`).classList.add('active');

            movieIframe.classList.add('hidden');
            playerLoader.style.display = 'block';
            playerStatus.style.display = 'block';

            setTimeout(() => {
                playerLoader.style.display = 'none';
                playerStatus.style.display = 'none';
                movieIframe.classList.remove('hidden');

                if (serverName === 'superembed') {
                    // SuperEmbed agrupa múltiples fuentes que suelen incluir servidores latinos
                    movieIframe.src = `https://superembed.stream/embed.php?tmdb=${currentTmdbId}`;
                } else if (serverName === 'autoembed') {
                    movieIframe.src = `https://autoembed.cc/embed/movie/tmdb/${currentTmdbId}`;
                } else if (serverName === 'vidsrcnet') {
                    movieIframe.src = `https://vidsrc.net/embed/movie/${currentTmdbId}`;
                }
            }, 300);
        }

        function closePlayer() {
            playerModal.classList.add('hidden');
            playerModal.classList.remove('flex');
            serverSelector.classList.add('hidden');
            movieIframe.src = "";
            currentTmdbId = null;
        }
    </script>
</body>
</html>
