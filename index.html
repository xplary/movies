<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEST Movies — Streaming Premium</title>
  <link rel="icon" type="image/png" href="https://www.pelisplushd.la/static/img/favicon.png">
  
  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- Navbar -->
  <nav class="netflix-navbar" id="netflix-navbar">
    <div class="nav-left">
      <div class="brand" id="brand-logo">
        <ion-icon name="videocam" class="brand-icon"></ion-icon>
        <h1>VEST <span>Movies</span></h1>
      </div>
      <ul class="nav-links">
        <li class="active" id="nav-item-home"><a id="nav-link-home">Inicio</a></li>
        <li id="nav-item-movies"><a class="filter-tab" data-type="movie">Películas</a></li>
        <li id="nav-item-series"><a class="filter-tab" data-type="series">Series</a></li>
        <li id="nav-item-anime"><a class="filter-tab" data-type="anime">Anime</a></li>
      </ul>
    </div>
    
    <div class="nav-right">
      <div class="search-container">
        <form id="search-form" class="search-form">
          <div class="search-box-wrapper">
            <ion-icon name="search-outline" class="search-icon"></ion-icon>
            <input type="text" id="search-input" placeholder="Buscar películas, series..." required>
            <button type="submit" class="btn-search-submit" style="display: none;"></button>
          </div>
        </form>
      </div>
    </div>
  </nav>

  <!-- HOME VIEW -->
  <main id="home-view" class="animate-fade-in">
    <section class="hero-banner" id="hero-banner" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1600');">
      <div class="hero-content">
        <span class="hero-type-badge" id="hero-type">PELÍCULA RECOMENDADA</span>
        <h2 class="hero-title" id="hero-title">Cargando...</h2>
        <div class="hero-meta-row">
          <div class="hero-meta-item rating"><ion-icon name="star"></ion-icon><span id="hero-rating">N/A</span></div>
          <div class="hero-meta-item"><ion-icon name="calendar-outline"></ion-icon><span id="hero-year">N/A</span></div>
        </div>
        <p class="hero-synopsis" id="hero-synopsis">Conectando con el servidor...</p>
        <div class="hero-actions">
          <button class="btn-hero play" id="hero-play-btn"><ion-icon name="play-sharp"></ion-icon><span>Reproducir Ahora</span></button>
        </div>
      </div>
      <div class="hero-dots" id="hero-dots"></div>
    </section>

    <section class="view-container carousel-section" id="carousel-section-container">
      <div class="carousel-row"><h2>Películas Destacadas</h2><div class="carousel-container" id="carousel-movies"></div></div>
      <div class="carousel-row"><h2>Series del Momento</h2><div class="carousel-container" id="carousel-series"></div></div>
      <div class="carousel-row"><h2>Anime Recomendado</h2><div class="carousel-container" id="carousel-anime"></div></div>
    </section>
  </main>

  <!-- GRID VIEW -->
  <section class="view-container grid-section hidden" id="grid-view">
    <div class="grid-header">
      <h2 id="results-title">Resultados</h2>
      <span class="results-count" id="results-count">0 items</span>
    </div>
    
    <div class="loading-state hidden" id="results-loading"><div class="spinner"></div><p>Cargando...</p></div>
    <div class="downloads-empty hidden" id="results-empty"><ion-icon name="film-outline"></ion-icon><p>Sin resultados.</p></div>
    <div class="catalog-grid" id="results-grid"></div>
  </section>

  <!-- THEATER MODAL (Modo Cine Automático) -->
  <div id="theater-modal" class="hidden">
    <div class="theater-content">
      <!-- Barra superior sutil -->
      <div class="theater-topbar">
        <div class="theater-info">
          <h3 id="theater-title">Cargando reproductor...</h3>
          <select id="season-selector" class="subtle-select hidden" title="Temporada"></select>
          <select id="episode-selector" class="subtle-select hidden" title="Capítulo"></select>
          <select id="server-selector" class="subtle-select hidden" title="Servidor de Video"></select>
          <button id="btn-next-server" class="btn-play-fallback hidden" title="Si el video no carga, haz clic aquí para cambiar de servidor">
            <ion-icon name="play-circle-outline"></ion-icon> Reproducir / Cambiar Opción
          </button>
        </div>
        <button class="btn-close-theater" id="btn-close-theater" title="Cerrar reproductor">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <div id="theater-loader" class="theater-loader hidden">
        <div class="spinner"></div>
        <p>Cargando servidor...</p>
      </div>

      <div class="iframe-container">
        <iframe id="theater-iframe" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
